<div
  class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm"
>

  <form
    method="get"
    class="grid grid-cols-1 gap-3 lg:grid-cols-[minmax(260px,1fr)_180px_auto]"
    data-real-plan-filter-form
  >

    <input
      type="hidden"
      name="week"
      value="{{ week_start|date:'Y-m-d' }}"
    >

    <div>
      {{ filter_form.q }}
    </div>

    <div>
      {{ filter_form.work_type }}
    </div>

    <div class="flex items-center gap-2">

      <button
        type="submit"
        class="h-[42px] rounded-xl bg-gray-900 px-5 text-sm font-extrabold text-white transition hover:bg-gray-800"
      >
        Apply
      </button>

      {% if search or work_type != "all" %}
        <a
          href="?week={{ week_start|date:'Y-m-d' }}"
          class="inline-flex h-[42px] items-center rounded-xl border border-gray-200 bg-white px-4 text-sm font-bold text-gray-600 transition hover:bg-gray-50"
          data-real-plan-navigation
          data-real-plan-scroll-mode="preserve"
        >
          Clear
        </a>
      {% endif %}

    </div>

  </form>

</div>
