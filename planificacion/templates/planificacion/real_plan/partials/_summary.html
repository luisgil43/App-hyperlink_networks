<div class="grid grid-cols-2 gap-3 lg:grid-cols-3 2xl:grid-cols-6">

  <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
    <div class="text-xs font-bold uppercase tracking-wide text-gray-400">
      Week Projects
    </div>
    <div class="mt-1 text-2xl font-extrabold text-gray-900">
      {{ summary.total_projects }}
    </div>
    <div class="mt-0.5 text-[10px] font-medium text-gray-400">
      {{ summary.all_active_projects }} active total
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
    <div class="text-xs font-bold uppercase tracking-wide text-gray-400">
      People
    </div>
    <div class="mt-1 text-2xl font-extrabold text-gray-900">
      {{ summary.technician_count }}
    </div>
  </div>

  <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4 shadow-sm">
    <div class="text-xs font-bold uppercase tracking-wide text-amber-600">
      Unassigned
    </div>
    <div class="mt-1 text-2xl font-extrabold text-amber-800">
      {{ summary.unassigned_projects }}
    </div>
  </div>

  <div class="rounded-2xl border border-blue-200 bg-blue-50 p-4 shadow-sm">
    <div class="text-xs font-bold uppercase tracking-wide text-blue-600">
      Team Projects
    </div>
    <div class="mt-1 text-2xl font-extrabold text-blue-800">
      {{ summary.team_projects }}
    </div>
  </div>

  <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 shadow-sm">
    <div class="text-xs font-bold uppercase tracking-wide text-emerald-600">
      Fiber
    </div>
    <div class="mt-1 text-2xl font-extrabold text-emerald-800">
      {{ summary.fiber_projects }}
    </div>
  </div>

  <div class="rounded-2xl border border-violet-200 bg-violet-50 p-4 shadow-sm">
    <div class="text-xs font-bold uppercase tracking-wide text-violet-600">
      Cable
    </div>
    <div class="mt-1 text-2xl font-extrabold text-violet-800">
      {{ summary.cable_projects }}
    </div>
  </div>

</div>
