<div
  class="rounded-2xl border border-gray-200 bg-white shadow-sm"
>

  <div
    class="flex flex-col gap-4 px-5 py-5 xl:flex-row xl:items-center xl:justify-between"
  >

    <div class="min-w-0">

      <div class="flex flex-wrap items-center gap-2">

        <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">
          Real Plan
        </h1>

        <span
          class="rounded-full border border-blue-200 bg-blue-50 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wide text-blue-700"
        >
          Operational Planning
        </span>

      </div>

      <p class="mt-1 text-sm text-gray-500">
        Project-level execution planning by person and day.
      </p>

    </div>


    <div class="flex flex-wrap items-center gap-2">

      <a
        href="?week={{ previous_week|date:'Y-m-d' }}{% if search %}&q={{ search|urlencode }}{% endif %}{% if work_type != 'all' %}&work_type={{ work_type|urlencode }}{% endif %}{% if status_filter_present %}&status_filter=1{% for status in statuses %}&statuses={{ status|urlencode }}{% endfor %}{% endif %}"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200 bg-white text-lg font-bold text-gray-600 transition hover:border-gray-300 hover:bg-gray-50"
        title="Previous week"
        data-real-plan-navigation
        data-real-plan-scroll-mode="start"
      >
        ‹
      </a>

      <a
        href="?week={{ today_week|date:'Y-m-d' }}{% if search %}&q={{ search|urlencode }}{% endif %}{% if work_type != 'all' %}&work_type={{ work_type|urlencode }}{% endif %}{% if status_filter_present %}&status_filter=1{% for status in statuses %}&statuses={{ status|urlencode }}{% endfor %}{% endif %}"
        class="inline-flex h-10 items-center justify-center rounded-xl border border-gray-200 bg-white px-4 text-sm font-bold text-gray-700 transition hover:border-gray-300 hover:bg-gray-50"
        data-real-plan-navigation
        data-real-plan-scroll-mode="start"
      >
        Today
      </a>


      <div
        class="relative"
        title="Select planning week"
      >

        <select
          class="h-10 min-w-[175px] appearance-none rounded-xl border border-gray-200 bg-white pl-3 pr-9 text-sm font-extrabold text-gray-700 outline-none transition hover:border-gray-300 focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
          data-real-plan-week-selector
          data-real-plan-search="{{ search }}"
          data-real-plan-work-type="{{ work_type }}"
          data-real-plan-status-filter="{% if status_filter_present %}1{% else %}0{% endif %}"
          data-real-plan-statuses="{{ statuses|join:',' }}"
          aria-label="Select planning week"
        >

          {% for week_option in week_options %}

            <option
              value="{{ week_option.start|date:'Y-m-d' }}"
              {% if week_option.selected %}selected{% endif %}
            >
              {{ week_option.full_label }}{% if week_option.is_current %} · Today{% endif %}
            </option>

          {% endfor %}

        </select>


        <div
          class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-[10px] font-black text-gray-400"
        >
          ▼
        </div>

      </div>


      <a
        href="?week={{ next_week|date:'Y-m-d' }}{% if search %}&q={{ search|urlencode }}{% endif %}{% if work_type != 'all' %}&work_type={{ work_type|urlencode }}{% endif %}{% if status_filter_present %}&status_filter=1{% for status in statuses %}&statuses={{ status|urlencode }}{% endfor %}{% endif %}"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200 bg-white text-lg font-bold text-gray-600 transition hover:border-gray-300 hover:bg-gray-50"
        title="Next week"
        data-real-plan-navigation
        data-real-plan-scroll-mode="start"
      >
        ›
      </a>

      <button
        type="button"
        class="inline-flex h-10 items-center gap-2 rounded-xl bg-blue-600 px-4 text-sm font-extrabold text-white shadow-sm transition hover:bg-blue-700"
        data-real-plan-recalculate
      >
        <span>↻</span>
        <span>Recalculate Plan</span>
      </button>

    </div>

  </div>


  <div
    class="flex items-center gap-1 border-t border-gray-100 px-5 py-2"
  >

    <button
      type="button"
      class="rounded-lg bg-gray-900 px-3 py-2 text-xs font-extrabold text-white"
    >
      Board
    </button>

    <button
      type="button"
      class="rounded-lg px-3 py-2 text-xs font-bold text-gray-400"
      disabled
      title="Timeline will be added after the operational board."
    >
      Timeline
    </button>

    <div class="flex-1"></div>

    <a
      href="{% url 'planificacion:master_plan' %}"
      class="rounded-lg px-3 py-2 text-xs font-bold text-gray-600 transition hover:bg-gray-100"
    >
      Master Plan
    </a>

  </div>

</div>
