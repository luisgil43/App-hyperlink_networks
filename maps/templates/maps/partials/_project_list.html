<!-- PROJECT LIST -->
<aside class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden flex flex-col map-workspace-height">

  <div class="px-3 py-3 border-b border-gray-200 flex-shrink-0">

    <div class="flex items-center justify-between gap-2">

      <div>
        <h2 class="font-bold text-gray-800">
          Projects
        </h2>

        <p class="text-xs text-gray-500 mt-0.5">
          {% if selected_scope == "all" %}
            All operational Project IDs
          {% else %}
            DFN {{ selected_scope }}
          {% endif %}
        </p>
      </div>

      <span class="inline-flex items-center justify-center min-w-[30px] h-7 px-2 rounded-full bg-gray-100 text-xs font-bold text-gray-700">
        {{ project_count }}
      </span>

    </div>


    <div class="mt-3">

      <input id="project-list-search"
             type="search"
             autocomplete="off"
             placeholder="Search Project ID..."
             class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200">

    </div>

  </div>


  <div id="project-list"
       class="p-3 space-y-2 overflow-y-auto flex-1 min-h-0">

    {% for project in projects %}

      <button type="button"
              class="js-project w-full text-left rounded-xl border border-gray-200 hover:border-blue-300 hover:bg-blue-50/40 p-3 transition"
              data-billing-id="{{ project.billing_id }}"
              data-full-id="{{ project.full_id|escape }}"
              data-display-id="{{ project.display_id|escape }}"
              data-dfn="{{ project.dfn|default_if_none:''|escape }}"
              data-status="{{ project.estado|escape }}"
              data-status-label="{{ project.status_label|escape }}"
              data-status-color="{{ project.status_color }}"
              data-lat="{{ project.latitude }}"
              data-lng="{{ project.longitude }}"
              data-radius="{{ project.validation_radius_m }}">

        <div class="flex items-start justify-between gap-2">

          <div class="min-w-0">

            <div class="font-bold text-sm text-gray-800 break-words">
              {% if selected_scope == "all" %}
                {{ project.full_id }}
              {% else %}
                {{ project.display_id }}
              {% endif %}
            </div>

            {% if selected_scope == "all" and project.dfn %}
              <div class="text-[11px] text-gray-400 mt-0.5">
                DFN {{ project.dfn }}
              </div>
            {% endif %}

          </div>


          {% if project.located %}

            <span class="flex-shrink-0 w-2.5 h-2.5 rounded-sm mt-1.5"
                  style="background: {{ project.status_color }};"
                  title="{{ project.status_label }}">
            </span>

          {% else %}

            <span class="flex-shrink-0 text-amber-500 text-sm"
                  title="Not located">
              ○
            </span>

          {% endif %}

        </div>


        <div class="mt-2 flex flex-wrap items-center gap-2">

          <span class="inline-flex items-center gap-1 text-[11px] font-semibold"
                style="color: {{ project.status_color }};">
            ● {{ project.status_label }}
          </span>

          {% if project.located %}

            <span class="text-[11px] text-gray-400">
              Located
            </span>

          {% else %}

            <span class="text-[11px] font-semibold text-amber-600">
              Not located
            </span>

          {% endif %}

        </div>

      </button>

    {% empty %}

      <div class="h-full min-h-[250px] flex items-center justify-center">

        <div class="p-5 text-center">
          <div class="text-3xl mb-2">📁</div>

          <div class="text-sm font-semibold text-gray-700">
            No projects available
          </div>
        </div>

      </div>

    {% endfor %}

  </div>

</aside>
