<!-- FILTER / SUMMARY -->
<div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-3 mb-3">

  <form method="get"
        class="grid grid-cols-1 lg:grid-cols-[300px_minmax(0,1fr)] gap-3 items-end">

    <div>
      <label for="scope"
             class="block text-xs font-semibold text-gray-600 mb-1">
        Project Scope
      </label>

      <select id="scope"
              name="scope"
              class="w-full border border-gray-300 rounded-xl px-3 py-2.5 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-200"
              onchange="this.form.submit()">

        <option value="all"
                {% if selected_scope == "all" %}selected{% endif %}>
          All Projects
        </option>

        {% for dfn in dfn_codes %}
          <option value="{{ dfn }}"
                  {% if selected_scope == dfn %}selected{% endif %}>
            DFN {{ dfn }}
          </option>
        {% endfor %}

      </select>
    </div>


    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">

      <div class="rounded-xl bg-gray-50 border border-gray-200 px-3 py-2">
        <div class="text-[10px] uppercase tracking-wide font-semibold text-gray-400">
          Context
        </div>

        <div class="text-sm font-bold text-gray-800 mt-0.5 truncate">
          {% if selected_scope == "all" %}
            All Projects
          {% else %}
            {{ selected_scope }}
          {% endif %}
        </div>
      </div>


      <div class="rounded-xl bg-gray-50 border border-gray-200 px-3 py-2">
        <div class="text-[10px] uppercase tracking-wide font-semibold text-gray-400">
          Projects
        </div>

        <div class="text-sm font-bold text-gray-800 mt-0.5">
          {{ project_count }}
        </div>
      </div>


      <div class="rounded-xl bg-green-50 border border-green-200 px-3 py-2">
        <div class="text-[10px] uppercase tracking-wide font-semibold text-green-600">
          Located
        </div>

        <div class="text-sm font-bold text-green-800 mt-0.5">
          {{ located_count }}
        </div>
      </div>


      <div class="rounded-xl bg-amber-50 border border-amber-200 px-3 py-2">
        <div class="text-[10px] uppercase tracking-wide font-semibold text-amber-600">
          Not located
        </div>

        <div class="text-sm font-bold text-amber-800 mt-0.5">
          {{ unlocated_count }}
        </div>
      </div>

    </div>

  </form>

</div>
